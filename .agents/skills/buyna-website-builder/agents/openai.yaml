interface:
  display_name: "Buyna.ai 建站引导助手"
  short_description: "默认团队模式，用一次工作包确认连续完成网站"
  default_prompt: "Use $buyna-website-builder in team mode. First establish workflow state. New build: call createWorkflow, run buyna-customer-intake at customer_intake, and persist its normalized capabilities. Repair or resume: load the existing workflow state and call importVerifiedHistory only for supplied verified delivery and approval records. Then route from persisted capabilities with scripts/route-builder.mjs, verify manifest evidence, and execute only its minimum fixed-module and Skill route. Generate project Adapters and project-owned design without a shared Dashboard skin. Continue an approved bounded work package without repeated confirmation. Keep local preview local; use GitHub or AWS only for a separately approved external operation."
