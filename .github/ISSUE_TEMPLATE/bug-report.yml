name: Skill bug report
description: Report installation, triggering, routing, or rule problems
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Affected Skill
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release version
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: I removed credentials and customer data from this report.
          required: true

