name: Skill request
description: Propose a new Skill or a scoped change to an existing Skill
title: "[Skill] "
labels: ["skill-request"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill name
      description: Existing name or proposed lowercase hyphenated name
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger example
      description: What would a teammate say to Codex?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: Include payment, authentication, AWS, database, or customer-data impact.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This request contains no credentials or customer secrets.
          required: true

