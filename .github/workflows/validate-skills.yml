name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "packages/**"
      - "scripts/validate.ps1"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/**"
      - "scripts/validate.ps1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate repository Skills
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Test fixed modules
        shell: pwsh
        run: |
          Get-ChildItem packages -Directory | ForEach-Object {
            npm test --prefix $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test project resource registry
        shell: pwsh
        run: node --test skills/buyna-project-resource-registry/scripts/validate-resource-record.test.mjs
      - name: Test RDS resource identity migration guard
        shell: pwsh
        run: node --test skills/buyna-unified-merchant-architecture/scripts/validate-resource-identity-migration.test.mjs
