interface:
  display_name: "Buyna.ai 建站引导助手"
  short_description: "默认团队模式，用一次工作包确认连续完成网站"
  default_prompt: "Use $buyna-website-builder in team mode. Determine recorded capabilities, read the routing map, verify selected fixed modules in repository-manifest.json, and generate only project Adapters, configuration, and presentation. Import verifiable prior delivery evidence when chat reports completed dependencies. Continue an approved bounded work package through ready included gates and minimum tests without repeated confirmation. Stop for a blocker, scope change, cost, destructive work, paid activation, or production release or traffic switching. Keep local preview in the current project; use GitHub or AWS only when that external operation is approved."
